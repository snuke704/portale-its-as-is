AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Portale corsi ITS ICT Piemonte: bucket privati per sito, log e scambio,
  piu tabella iscrizioni cifrata e ripristinabile.

Parameters:
  Env:
    Type: String
    Description: Ambiente di destinazione
    AllowedValues: [dev, test, prod]
    Default: test
  Owner:
    Type: String
    Description: Squadra responsabile della risorsa
    Default: squadra-0
    MinLength: 3
  SupplierPrincipalArn:
    Type: String
    Description: ARN IAM verificato del fornitore; vuoto lascia disattivato l'accesso
    Default: ''

Conditions:
  HasSupplierPrincipal: !Not [!Equals [!Ref SupplierPrincipalArn, '']]

Resources:
  LogBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Il bucket dei log non registra se stesso per evitare ricorsione.
    Properties:
      BucketName: !Sub 'portale-its-log-${Env}-${AWS::AccountId}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Env
          Value: !Ref Env
        - Key: Progetto
          Value: portale-its

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ConsentiScritturaLogS3
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LogBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  SiteBucket:
    Type: AWS::S3::Bucket
    DependsOn: LogBucketPolicy
    Properties:
      BucketName: !Sub 'portale-its-sito-${Env}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: !Sub 'sito/${Env}/'
      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Env
          Value: !Ref Env
        - Key: Progetto
          Value: portale-its

  ExchangeBucket:
    Type: AWS::S3::Bucket
    DependsOn: LogBucketPolicy
    Properties:
      BucketName: !Sub 'portale-its-scambio-${Env}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: !Sub 'scambio/${Env}/'
      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Env
          Value: !Ref Env
        - Key: Progetto
          Value: portale-its

  SupplierUploadPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasSupplierPrincipal
    Properties:
      Bucket: !Ref ExchangeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ConsentiSoloUploadFornitore
            Effect: Allow
            Principal:
              AWS: !Ref SupplierPrincipalArn
            Action: s3:PutObject
            Resource: !Sub '${ExchangeBucket.Arn}/incoming/*'
            Condition:
              StringEquals:
                s3:x-amz-server-side-encryption: AES256

  IscrizioniKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Chiave di cifratura della tabella iscrizioni del portale ITS
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: ConsentiAmministrazioneAllAccount
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'

  IscrizioniTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'portale-its-iscrizioni-${Env}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: iscrizioneId
          AttributeType: S
      KeySchema:
        - AttributeName: iscrizioneId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref IscrizioniKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Env
          Value: !Ref Env
        - Key: Progetto
          Value: portale-its

Outputs:
  SiteBucketName:
    Description: Bucket privato usato nel collaudo del portale
    Value: !Ref SiteBucket
  LogBucketName:
    Description: Bucket dei log di accesso
    Value: !Ref LogBucket
  ExchangeBucketName:
    Description: Bucket di scambio in sola scrittura per il fornitore
    Value: !Ref ExchangeBucket
  IscrizioniTableName:
    Description: Tabella delle iscrizioni
    Value: !Ref IscrizioniTable
